name: Mirror Extension to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      - 'pages/**'
      - 'packages/**'
      - 'bash-scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.example.env'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare public mirror
        run: |
          rm -rf website video docs documents scripts tests
          rm -rf .cursorrules .cursor .letta .history .playwright-mcp
          rm -rf output coverage
          rm -rf .github/workflows.disabled
          rm -f .github/workflows/mirror-public.yml
          rm -f RENAME_SUMMARY.md UPDATE-PACKAGE-VERSIONS.md CHANGELOG.md
          rm -f .gitguardian.yaml

          # Clean pnpm-workspace.yaml
          sed -i '/^  - website$/d; /^  - video$/d; /^  - tests\/\*$/d' pnpm-workspace.yaml

          # Clean package.json: remove website/video/e2e scripts, update repo URL
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          pkg.repository = {
            type: 'git',
            url: 'https://github.com/wikytam/zfocus-public.git'
          };

          const removeScripts = [
            'website:dev', 'website:build', 'website:start', 'website:deploy',
            'website:db:migrate', 'website:db:studio',
            'video:dev', 'video:render', 'video:render:en', 'video:render:all',
            'e2e', 'e2e:firefox'
          ];
          for (const key of removeScripts) {
            delete pkg.scripts[key];
          }

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Clean turbo.json: remove website-specific and e2e tasks
          node -e "
          const fs = require('fs');
          const turbo = JSON.parse(fs.readFileSync('turbo.json', 'utf8'));

          delete turbo.tasks['@zfocus/website#build'];
          delete turbo.tasks['@zfocus/website#dev'];
          delete turbo.tasks['e2e'];

          fs.writeFileSync('turbo.json', JSON.stringify(turbo, null, 2) + '\n');
          "

          # Clean .gitignore: remove video/build line
          sed -i '/^video\/build$/d' .gitignore

      - name: Configure SSH for public repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push to public repo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Mirror from private repo" --allow-empty

          git remote add public git@github.com:wikytam/zfocus-public.git
          git push public main --force

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
